<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calculadora</title>
<meta name="theme-color" content="#F0EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculadora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F0EEE6;--panel:#FAF9F5;--key:#FFFFFF;--fn:#E7E3D6;--ink:#1F1E1D;--mute:#8A8778;--line:#DFDACB;--accent:#D97757;--accent-d:#C0583A;--shadow:0 1px 0 rgba(0,0,0,.04),0 2px 6px rgba(60,50,30,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--panel:#30302E;--key:#3B3A37;--fn:#32312E;--ink:#FAF9F5;--mute:#A09D90;--line:#45443F;--accent-d:#EA8E6F;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:8px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-family:ui-serif,"Iowan Old Style",Georgia,serif;font-size:21px}
.brand i{font-style:normal;color:var(--accent);font-size:24px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.chip:active{background:var(--fn)}
.tog{display:none}
.disp{flex:0 0 auto;height:clamp(150px,24vh,260px);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:16px 26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;box-shadow:var(--shadow)}
.sub{min-height:28px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:22px}
.main{max-width:100%;overflow:hidden;white-space:nowrap;line-height:1.15;font-family:ui-serif,"Iowan Old Style",Georgia,serif;font-size:76px}
.pads{flex:1;min-height:0;display:flex;gap:18px}
.pad{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px}
.k{background:var(--key);border:1px solid var(--line);border-radius:20px;font-size:clamp(22px,3.4vmin,34px);font-weight:500;box-shadow:var(--shadow);transition:transform .08s,filter .08s}
.k:active{transform:scale(.95);filter:brightness(.94)}
.f{background:var(--fn);font-size:clamp(17px,2.5vmin,25px)}
.o{background:var(--panel);color:var(--accent-d);font-weight:600}
.c{color:var(--accent-d);font-weight:600}
.eq{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bd{position:fixed;inset:0;background:rgba(20,18,12,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(380px,88vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom))}
.open .bd{opacity:1;pointer-events:auto}.open .dr{transform:none}
.dr header{display:flex;justify-content:space-between;align-items:center;font-family:ui-serif,Georgia,serif;font-size:22px;margin-bottom:10px}
.dr header button{background:none;color:var(--accent-d);font-size:15px;font-weight:600;padding:8px}
.dr ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.dr li{padding:12px 4px;border-bottom:1px solid var(--line);text-align:right;cursor:pointer}
.dr li small{display:block;color:var(--mute);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr li b{font-family:ui-serif,Georgia,serif;font-weight:400;font-size:28px}
.empty{color:var(--mute);text-align:center;padding:40px 0;cursor:default!important;border:0!important}
@media(max-width:699px){.sci{display:none}.sci-on .sci{display:grid}.sci-on .basic{display:none}.tog{display:inline-flex}.main{font-size:60px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand"><i>✻</i>Calculadora</div>
    <button class="chip tog" id="tog">f(x)</button>
    <button class="chip" id="deg">DEG</button>
    <button class="chip" id="hist">Histórico</button>
  </div>
  <div class="disp"><div class="sub" id="sub"></div><div class="main" id="main">0</div></div>
  <div class="pads" id="pads"><div class="pad sci" id="sci"></div><div class="pad basic" id="basic"></div></div>
</div>
<div id="bd" class="bd"></div>
<aside class="dr"><header>Histórico<button id="clr">Limpar</button></header><ul id="hl"></ul></aside>
<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let expr='',done=false,err=false,val=0,lastExpr='',deg=store.get('deg',true),hist=store.get('hist',[]);

const SCI=[['(','('],[')',')'],['π','π'],['e','e'],['sin','sin('],['cos','cos('],['tan','tan('],['x²','^2'],['sin⁻¹','asin('],['cos⁻¹','acos('],['tan⁻¹','atan('],['√','√('],['ln','ln('],['log','log('],['xʸ','^'],['10ˣ','10^('],['n!','!'],['x⁻¹','^(−1)'],['eˣ','e^('],['|x|','abs(']];
const BAS=[['AC','AC','c'],['⌫','⌫','c'],['%','%','o'],['÷','÷','o'],['7','7'],['8','8'],['9','9'],['×','×','o'],['4','4'],['5','5'],['6','6'],['−','−','o'],['1','1'],['2','2'],['3','3'],['+','+','o'],['±','±','o'],['0','0'],[',','.'],['=','=','eq']];
const build=(el,a,c)=>el.innerHTML=a.map(([l,k,x])=>`<button class="k ${x||c||''}" data-k="${k}">${l}</button>`).join('');
build($('sci'),SCI,'f');build($('basic'),BAS);

/* ---------- avaliador (sem eval) ---------- */
function evaluate(s){
  const T=[],re=/(\d+\.?\d*|\.\d+|asin|acos|atan|sin|cos|tan|ln|log|exp|abs|√|π|e|[+\-−×÷^!%()])/y;
  for(let i=0,m;i<s.length;){re.lastIndex=i;m=re.exec(s);if(!m)return null;T.push(m[1]);i=re.lastIndex}
  let p=0,pct=false;const pk=()=>T[p];
  const rad=x=>deg?x*Math.PI/180:x,back=x=>deg?x*180/Math.PI:x,snap=x=>Math.abs(x)<1e-14?0:x;
  const fact=n=>{if(n<0||!Number.isInteger(n)||n>170)throw 0;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
  const F={sin:x=>snap(Math.sin(rad(x))),cos:x=>snap(Math.cos(rad(x))),tan:x=>snap(Math.tan(rad(x))),asin:x=>back(Math.asin(x)),acos:x=>back(Math.acos(x)),atan:x=>back(Math.atan(x)),ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs,'√':Math.sqrt};
  function ex(){let v=tm();while(pk()==='+'||pk()==='−'||pk()==='-'){const o=T[p++];pct=false;let b=tm();if(pct)b=v*b;v=o==='+'?v+b:v-b}return v}
  function tm(){let v=un();for(;;){const t=pk();if(t==='×'||t==='÷'){p++;const b=un();v=t==='×'?v*b:v/b}else if(t!==undefined&&/^[\d.a-zπ√(]/.test(t))v*=pw();else break}return v}
  function un(){const t=pk();if(t==='−'||t==='-'){p++;return -un()}if(t==='+'){p++;return un()}return pw()}
  function pw(){const b=pf();if(pk()==='^'){p++;return Math.pow(b,un())}return b}
  function pf(){let v=pr();while(pk()==='!'||pk()==='%'){const t=T[p++];if(t==='!')v=fact(v);else{v/=100;pct=true}}return v}
  function pr(){pct=false;const t=T[p++];if(t===undefined)throw 0;
    if(/^[\d.]/.test(t))return parseFloat(t);
    if(t==='π')return Math.PI;if(t==='e')return Math.E;
    if(t==='('){const v=ex();if(pk()===')')p++;return v}
    if(F[t]){if(pk()!=='(')throw 0;p++;const v=ex();if(pk()===')')p++;return F[t](v)}
    throw 0}
  try{const v=ex();if(p<T.length||!isFinite(v))return null;return parseFloat(v.toPrecision(12))}catch(e){return null}
}

/* ---------- formatação ---------- */
const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:10});
function fmt(n){if(n===0)return'0';const a=Math.abs(n);if(a>=1e15||a<1e-7)return n.toExponential(6).replace(/\.?0+e/,'e').replace('.',',').replace(/e\+?(-?)(\d+)/,(m,s,d)=>'×10^'+(s?'−':'')+d);return nf.format(n)}
const disp=s=>s.replace(/\./g,',').replace(/\^\(−1\)/g,'⁻¹').replace(/\^2(?!\d)/g,'²');
function toExpr(n){const s=String(n);if(/e/.test(s)){const[m,x]=s.split('e');return m.replace('-','−')+'×10^('+x.replace('+','').replace('-','−')+')'}return s.replace('-','−')}

/* ---------- tela ---------- */
function fit(){const m=$('main');let s=innerWidth<700?60:76;m.style.fontSize=s+'px';while(m.scrollWidth>m.clientWidth&&s>26){s-=4;m.style.fontSize=s+'px'}}
function render(){
  const main=$('main'),sub=$('sub');
  if(err){main.textContent='Erro';sub.textContent='Confira a expressão'}
  else if(done){main.textContent=fmt(val);sub.textContent=disp(lastExpr)+' ='}
  else{main.textContent=disp(expr)||'0';let pv='';if(/[^\d.]/.test(expr)){const r=evaluate(expr);if(r!==null)pv='= '+fmt(r)}sub.textContent=pv}
  fit();
}

/* ---------- teclas ---------- */
function press(k){
  if(err){err=false;expr='';done=false}
  if(k==='AC'){expr='';done=false;return render()}
  if(k==='⌫'){if(done){expr='';done=false}else expr=expr.replace(/(10\^|e\^|asin|acos|atan|sin|cos|tan|ln|log|exp|abs|√)\($|.$/,'');return render()}
  if(k==='='){if(!expr||done)return;const r=evaluate(expr);if(r===null){err=true;return render()}
    hist.unshift({e:expr,r});hist=hist.slice(0,40);store.set('hist',hist);lastExpr=expr;val=r;expr=toExpr(r);done=true;return render()}
  if(k==='±'){if(done)done=false;const m=expr.match(/\(−(\d*\.?\d*)\)$/);
    if(m)expr=expr.slice(0,m.index)+m[1];else{const n=expr.match(/\d*\.?\d+$|\d+\.$/);if(n)expr=expr.slice(0,n.index)+'(−'+n[0]+')'}return render()}
  if(k==='.'){if(done){expr='';done=false}const seg=expr.match(/[\d.]*$/)[0];if(seg.includes('.'))return;expr+=seg===''?'0.':'.';return render()}
  const op=/^[+−×÷]$/.test(k),post=/^(\^|!|%)/.test(k);
  if(done){if(!op&&!post&&k!==')')expr='';done=false}
  if(k===')'&&(expr.match(/\(/g)||[]).length<=(expr.match(/\)/g)||[]).length)return;
  if(op){if(!expr){if(k==='−')expr='−';return render()}if(/[+−×÷]$/.test(expr)){if(expr.length===1)return;expr=expr.slice(0,-1)}}
  if(post&&(!expr||/[+−×÷(^]$/.test(expr)))return;
  expr+=k;render();
}
document.querySelector('.pads').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;const M={'*':'×','/':'÷','-':'−',',':'.','Enter':'=','Backspace':'⌫','Escape':'AC'};const k=M[e.key]||e.key;
  if(/^[\d.+×÷−()^%!=]$/.test(k)||['⌫','AC','='].includes(k)){e.preventDefault();press(k)}});

/* ---------- graus/rad, f(x), histórico ---------- */
const degBtn=$('deg');const setDeg=()=>{degBtn.textContent=deg?'DEG':'RAD';store.set('deg',deg)};setDeg();
degBtn.onclick=()=>{deg=!deg;setDeg();render()};
$('tog').onclick=()=>{const on=$('pads').classList.toggle('sci-on');$('tog').textContent=on?'123':'f(x)'};
function drawHist(){$('hl').innerHTML=hist.length?hist.map((h,i)=>`<li data-i="${i}"><small>${disp(h.e)} =</small><b>${fmt(h.r)}</b></li>`).join(''):'<li class="empty">Seus cálculos aparecem aqui.</li>'}
const toggleDr=o=>{if(o)drawHist();document.body.classList.toggle('open',o)};
$('hist').onclick=()=>toggleDr(true);$('bd').onclick=()=>toggleDr(false);
$('clr').onclick=()=>{hist=[];store.set('hist',hist);drawHist()};
$('hl').onclick=e=>{const li=e.target.closest('li[data-i]');if(!li)return;expr=toExpr(hist[li.dataset.i].r);done=false;err=false;toggleDr(false);render()};
addEventListener('resize',fit);
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
